# Políticas de red del modelo (Anexo B, {lst:b_politicas_red}), aplicadas por Amazon
# VPC CNI en modo estricto. Obligan a que el tráfico Este-Oeste pase por VPC Lattice y
# cierran el acceso directo entre pods y al servicio de metadatos (sección 7.2.7).

# 1. Denegación por defecto de entrada y salida en el espacio de nombres tienda.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: denegar-todo
  namespace: tienda
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2. Salida solo hacia el DNS, VPC Lattice y el agente de EKS Pod Identity.
#    169.254.169.254 (servicio de metadatos) queda fuera y, por tanto, bloqueado.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: salida-permitida
  namespace: tienda
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 169.254.171.0/24 } # VPC Lattice
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 8443 }
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 } # agente de EKS Pod Identity
      ports:
        - { protocol: TCP, port: 80 }
---
# 3. Entrada a la aplicación solo desde VPC Lattice; a las métricas, desde observabilidad.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrada-permitida
  namespace: tienda
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 169.254.171.0/24 }
      ports:
        - { protocol: TCP, port: 8443 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observabilidad
      ports:
        - { protocol: TCP, port: 8081 }
---
# 4. Servicio de auditoría: API y métricas desde observabilidad; salida a CloudWatch Logs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auditoria
  namespace: auditoria
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observabilidad
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 169.254.170.23/32 }
      ports:
        - { protocol: TCP, port: 80 }
    - to:
        - ipBlock: # API pública de CloudWatch Logs (vía NAT)
            cidr: 0.0.0.0/0
            except: [10.0.0.0/16, 169.254.0.0/16]
      ports:
        - { protocol: TCP, port: 443 }
