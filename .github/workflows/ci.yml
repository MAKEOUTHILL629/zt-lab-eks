# Integración continua del laboratorio (sección 7.3.9, Anexo F).
# Compila y prueba los microservicios Java y los scripts de Python, y al integrar en
# main publica las siete imágenes en GitHub Container Registry.
name: ci-zt-lab
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compilar y ejecutar las pruebas (JUnit 5, Mockito, StepVerifier)
        working-directory: apps
        run: mvn -B verify
      - name: Análisis de dependencias de la solicitud de cambio
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
      - name: Conservar los artefactos para la publicación de imágenes
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: apps/*/target/*.jar
          retention-days: 1

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "botocore[crt]" requests pandas numpy matplotlib pytest
      - name: Ejecutar las pruebas de Python
        run: pytest -q portal ataques analisis

  publicar:
    needs: [java, python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { imagen: catalogo, contexto: apps/catalogo }
          - { imagen: clientes, contexto: apps/clientes }
          - { imagen: pedidos, contexto: apps/pedidos }
          - { imagen: pagos, contexto: apps/pagos }
          - { imagen: auditoria, contexto: apps/auditoria }
          - { imagen: portal, contexto: portal }
          - { imagen: ataques, contexto: ataques }
    steps:
      - uses: actions/checkout@v7
      - name: Recuperar los jar compilados
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: apps
      - name: Propietario en minúsculas (requisito de GHCR)
        id: due
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
      - uses: docker/setup-buildx-action@v4
      - name: Autenticarse en GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: |
            ghcr.io/${{ steps.due.outputs.owner }}/zt-${{ matrix.imagen }}:${{ github.sha }}
            ghcr.io/${{ steps.due.outputs.owner }}/zt-${{ matrix.imagen }}:latest
