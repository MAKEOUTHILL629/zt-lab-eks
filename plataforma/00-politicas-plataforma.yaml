# Políticas de permiso para los espacios de nombres de plataforma.
#
# POR QUÉ SON NECESARIAS: el complemento Amazon VPC CNI se despliega en modo estricto
# (NETWORK_POLICY_ENFORCING_MODE=strict). Según la documentación de AWS, en modo
# estricto TODO pod que use el CNI arranca con denegación por defecto y requiere una
# política de red para cada destino, "incluidos los pods de CoreDNS". Sin estas
# políticas, CoreDNS queda aislado y se rompe la resolución DNS de todo el clúster.
#
# El alcance Zero Trust del trabajo es el tráfico Este-Oeste de la tienda; los espacios
# de plataforma se abren por completo. Los pods con red de host (aws-node, kube-proxy,
# eks-pod-identity-agent) no se ven afectados por el modo estricto.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-todo
  namespace: kube-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{}]
  egress: [{}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-todo
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{}]
  egress: [{}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-todo
  namespace: aws-application-networking-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{}]
  egress: [{}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-todo
  namespace: observabilidad
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{}]
  egress: [{}]
